# ==============================================================================
# HELM CHART METADATA: CATALOGUE (roboshop-helm/catalogue/Chart.yaml)
# ==============================================================================
# Concept & Purpose:
# - Serves as the manifest definition for the standalone Catalogue Helm chart.
# - Distinguishes between chart packaging version ('version') and application
#   software version ('appVersion').

apiVersion: v2                     # Helm API version (v2 is the standard for Helm 3+)
name: catalogue                    # Name of the Helm chart package
version: 0.0.1                     # Chart release version (incremented when templates or values change)
appVersion: 1.0.0                  # Software / Node.js application version deployed by this chart
description: "RoboShop Catalogue Microservice Helm Chart - version 1.0.0"  # Human-readable package description